<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת תורים | אריאל פינברב</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #d4af37;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 20px;
            border: 1px solid #d4af37;
            border-radius: 15px;
            background: #1a1a1a;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background-color: #d4af37;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            font-size: 18px;
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="margin-bottom: 10px;">אריאל פינברב</h2>
        <p>כדי להבטיח את איכות ההזמנה,</p>
        <p>יש ללחוץ על הכפתור לפתיחת המערכת:</p>
        
        <a href="https://script.google.com/macros/s/AKfycbyMKlE80sp88k4C2ECwE4W7oYz9vBj1gv0JiOGkFw7YF6bSoYoopFHUje2zMHRvrdLZ1g/exec" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="btn">
           כניסה לקביעת תור
        </a>
    </div>

</body>
</html>
