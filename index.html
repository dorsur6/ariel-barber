<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעבר לדפדפן חיצוני | אריאל פינברב</title>
    <style>
        body {
            background-color: #0c0c0c;
            color: #d4af37;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #d4af37;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 300px;
        }
        h2 { margin-top: 0; font-size: 22px; }
        p { color: #ccc; font-size: 14px; line-height: 1.5; }
        .btn {
            display: block;
            margin-top: 25px;
            padding: 15px 25px;
            background-color: #d4af37;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .footer-note {
            margin-top: 20px;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>אריאל פינברב</h2>
        <p>כדי שתוכל לבחור תאריך בנוחות, עלינו לעבור לדפדפן המקורי של הטלפון.</p>
        
        <a href="https://script.google.com/macros/s/AKfycbyMKlE80sp88k4C2ECwE4W7oYz9vBj1gv0JiOGkFw7YF6bSoYoopFHUje2zMHRvrdLZ1g/exec" 
           onclick="window.open(this.href, '_system'); return false;" 
           target="_blank" 
           class="btn">
           לחץ כאן לפתיחה בספארי
        </a>

        <div class="footer-note">
            * אם הלחיצה לא פתחה את האתר, לחץ על 3 הנקודות למעלה ובחר "פתח בדפדפן"
        </div>
    </div>

    <script>
        // טריק לאנדרואיד: מנסה לפתוח ישירות ב-Chrome Intent
        if (navigator.userAgent.match(/Android/i)) {
            var googleUrl = "https://script.google.com/macros/s/AKfycbyMKlE80sp88k4C2ECwE4W7oYz9vBj1gv0JiOGkFw7YF6bSoYoopFHUje2zMHRvrdLZ1g/exec";
            var intentUrl = "intent://" + googleUrl.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;end";
            // אנחנו לא מעבירים אוטומטית כדי לא להיחסם, אבל מכינים את הכפתור
        }
    </script>

</body>
</html>
